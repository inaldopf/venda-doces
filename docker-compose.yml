# Banco local para desenvolvimento. (A API entra no compose na Fase 4.)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: venda
      POSTGRES_PASSWORD: venda_dev
      POSTGRES_DB: venda_doces
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
